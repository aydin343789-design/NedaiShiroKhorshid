name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK — Hybrid TTS
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Prepare persistent Android signing (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android-release.keystore"
            echo "ANDROID_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android-release.keystore" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "No persistent keystore configured; using debug signing for this build."
          fi

      - name: Create Android shell, sync, and generate project assets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:sync

      - name: Assemble signed APK
        working-directory: android
        run: |
          if [ "$ANDROID_SIGNING_ENABLED" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Nedaye-Shirokhorshid-release.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Nedaye-Shirokhorshid-debug.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nedaye-Shirokhorshid-apk
          path: Nedaye-Shirokhorshid-*.apk
          if-no-files-found: error
